# Runs the automated tests on every pull request and on every push to main.
# A step is skipped while its project does not exist yet in the repository.
#
# To confirm once the team has agreed: folder names (api, back, front),
# Maven as the Java build tool, and Java 21.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  java-tests:
    name: Java tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [api, back]
    steps:
      - uses: actions/checkout@v4

      - name: Report missing project
        if: hashFiles(format('{0}/pom.xml', matrix.project)) == ''
        run: echo "::notice::No ${{ matrix.project }}/pom.xml found, tests skipped."

      - name: Set up Java
        if: hashFiles(format('{0}/pom.xml', matrix.project)) != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        if: hashFiles(format('{0}/pom.xml', matrix.project)) != ''
        working-directory: ${{ matrix.project }}
        run: mvn --batch-mode verify

  front-tests:
    name: Front tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Report missing project
        if: hashFiles('front/package-lock.json') == ''
        run: echo "::notice::No front/package-lock.json found, tests skipped."

      - name: Set up Node.js
        if: hashFiles('front/package-lock.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        if: hashFiles('front/package-lock.json') != ''
        working-directory: front
        run: npm ci

      - name: Run tests
        if: hashFiles('front/package-lock.json') != ''
        working-directory: front
        run: npm test -- --ci
