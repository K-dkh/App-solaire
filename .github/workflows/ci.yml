# Runs the automated tests on every pull request and on every push to main.
# A step is skipped while its project does not exist yet in the repository.
#
# To confirm once the team has agreed: folder names (api, back, front),
# Maven as the Java build tool, and Java 21.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  java-tests:
    name: Java tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [api, back]
    steps:
      - uses: actions/checkout@v4

      - name: Report missing project
        if: hashFiles(format('{0}/pom.xml', matrix.project)) == ''
        run: echo "::notice::No ${{ matrix.project }}/pom.xml found, tests skipped."

      - name: Set up Java
        if: hashFiles(format('{0}/pom.xml', matrix.project)) != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        if: hashFiles(format('{0}/pom.xml', matrix.project)) != ''
        working-directory: ${{ matrix.project }}
        run: mvn --batch-mode verify

  front-tests:
    name: Front checks (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4

      - name: Report missing project
        if: hashFiles('front/package-lock.json') == ''
        working-directory: .
        run: echo "::notice::No front/package-lock.json found, tests skipped."

      - name: Set up Node.js
        if: hashFiles('front/package-lock.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        if: hashFiles('front/package-lock.json') != ''
        run: npm ci

      - name: Lint
        if: hashFiles('front/package-lock.json') != ''
        run: npm run lint

      - name: Type check
        if: hashFiles('front/package-lock.json') != ''
        run: npm run typecheck

      # Fails if a test fails or if the coverage drops below the threshold of jest.config.js.
      - name: Run tests with coverage
        if: hashFiles('front/package-lock.json') != ''
        run: npm run test:coverage -- --ci

      - name: Upload coverage report
        if: always() && hashFiles('front/coverage/lcov-report/index.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: front-coverage
          path: front/coverage/lcov-report
          retention-days: 14
